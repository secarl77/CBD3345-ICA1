name: Artifact Demo Upload

on:
  push:
    branches: [ develop ]
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Generate files
      run: |
        rm -rf artifacts
        mkdir artifacts
        echo "Build complete at $(date)" > artifacts/build-info.txt

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: build-artifact
        path: artifacts/

    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: artifacts/build-info.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

