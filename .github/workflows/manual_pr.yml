name: Manual CodeQL Scan1

on:
  workflow_dispatch:
    inputs:
      scan_target:
        description: '¿Qué rama deseas escanear?'
        required: true
        default: 'develop'
        type: string

name: CodeQL Manual/PR Analysis

on:
  # Permite ejecutar el análisis manualmente desde la interfaz de GitHub
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to analyze'
        required: true
        default: 'develop'


jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.head_ref }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: python
          build-mode: none  # Para proyectos Python no se necesita build

      - name: Autobuild
        uses: github/codeql-action/autobuild@v2

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2
